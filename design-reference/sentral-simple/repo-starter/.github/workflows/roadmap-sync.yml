name: roadmap-sync
on:
  push: { branches: [main], paths: ["roadmap/**"] }
  issues: { types: [edited, closed, reopened] }
  pull_request: { types: [opened, closed] }
  schedule: [{ cron: "0 2 * * *" }]   # nightly rules check
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: node scripts/roadmap-sync.mjs     # front matter <-> GitHub issue + Project fields
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
      - run: node scripts/roadmap-audit.mjs    # files without PRs, PRs without files, stale flags
        env: { SENTRAL_WEBHOOK_TOKEN: ${{ secrets.SENTRAL_WEBHOOK_TOKEN }} }
